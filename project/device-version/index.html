<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delish Cake Orders - Device Preview</title>
  <style>
    :root{--bg:#f6f2ef;--panel:#fff;--ink:#211918;--muted:#756965;--line:#e6d9d2;--brand:#8d3f45;--bad:#b3261e;--good:#24734b;--warn:#9a6500;--shadow:0 10px 28px rgba(46,30,24,.08)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{min-height:42px;border:0;border-radius:8px;padding:9px 13px;background:#eee5df;color:var(--ink);cursor:pointer;font-weight:700}button.primary{background:var(--brand);color:#fff}button.danger{background:var(--bad);color:#fff}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}textarea{min-height:82px;resize:vertical}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginBox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:22px}.field{min-width:0}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:700}.loginBox .field{margin-top:12px}.notice{border:1px solid #f0d7ab;border-radius:8px;padding:10px 12px;margin-bottom:14px;background:#fff8e8;color:#684400;line-height:1.6}
    .app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;padding:16px;background:#241b19;color:#fff;overflow:auto}.brand{padding:8px 6px 15px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12)}.brand strong{display:block;font-size:20px}.brand span{display:block;margin-top:5px;color:#ddcec7;font-size:13px}.nav button{width:100%;display:flex;justify-content:flex-start;margin:4px 0;background:transparent;color:#eee2dd;text-align:right}.nav button.active,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}.main{min-width:0;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.topbar h1{margin:0;font-size:26px}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.card{padding:15px}.cardLabel{color:var(--muted);font-size:13px}.cardValue{margin-top:8px;font-size:28px;font-weight:800}.panel{margin-top:14px;overflow:hidden}.panelHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}.panelHeader h2{margin:0;font-size:18px}.panelBody{padding:14px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 170px 150px 150px auto;gap:8px;padding:14px}.tableWrap{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}th{background:#fff7f3;color:var(--muted);font-size:13px}
    .badge{display:inline-flex;align-items:center;min-height:28px;border-radius:999px;padding:4px 9px;background:#eee7e2;color:var(--muted);font-size:12px;font-weight:700}.badge.good{background:#e7f3ec;color:var(--good)}.badge.warn{background:#fff2d8;color:var(--warn)}.badge.bad{background:#fde8e6;color:var(--bad)}
    .formGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:14px;background:rgba(32,26,24,.62)}.modal.open{display:flex}.modalBox{width:min(1080px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.calendarGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.calendarItem{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;text-align:right}.calendarItem.late{border-color:#efb4ae;background:#fff5f4}.toast{position:fixed;right:16px;bottom:16px;z-index:40;max-width:min(380px,calc(100vw - 32px));padding:12px 14px;border-radius:8px;background:#241b19;color:#fff;box-shadow:var(--shadow)}
    @media(max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.nav{display:flex;gap:6px;overflow:auto}.nav button{width:auto;min-width:max-content}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.formGrid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.main{padding:12px}.topbar,.panelHeader{align-items:stretch;flex-direction:column}.cards,.toolbar,.formGrid,.calendarGrid{grid-template-columns:1fr}.actions button,.topbar button{width:100%}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const STATUSES=['جديد','قيد المتابعة','بانتظار التأكيد','مثبت','قيد التجهيز','جاهز','تم التسليم','ملغي'];
    const PAYMENT_STATUSES=['غير مدفوع','مدفوع جزئيًا','مدفوع بالكامل'];
    const PAYMENT_METHODS=['Cash','Click','PayPal','Western Union','Bank Transfer','Other'];
    const ORDER_TYPES=['كيكة','ميني كيك','بوكس','أخرى'];
    const DELIVERY_TYPES=['توصيل','استلام'];
    const ROLES=['Admin','Social Media Employee','Sales Employee'];
    const STORE_KEY='delish_device_preview_v1',SESSION_KEY='delish_device_session_v1';
    const root=document.getElementById('root');let db=loadDb();let user=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');let page='dashboard';let currentOrder=null;init();
    function init(){setupSystem();user?renderApp():renderLogin()}
    function loadDb(){const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);const today=new Date().toISOString().slice(0,10);return{Orders:[],Employees:[{'Employee ID':'ADMIN','Employee Name':'Administrator',Phone:'',Username:'admin','Password Hash':hash('admin123'),Role:'Admin',Active:true,'Created Date':today,'Last Login':''},{'Employee ID':'EMP_1','Employee Name':'Social Demo',Phone:'',Username:'social','Password Hash':hash('social123'),Role:'Social Media Employee',Active:true,'Created Date':today,'Last Login':''},{'Employee ID':'EMP_2','Employee Name':'Sales Demo',Phone:'',Username:'sales','Password Hash':hash('sales123'),Role:'Sales Employee',Active:true,'Created Date':today,'Last Login':''}],AuditLog:[],Settings:[{Setting:'SHOP_NAME',Value:'Delish Cake'},{Setting:'ORDER_PREFIX',Value:'11_'},{Setting:'NEXT_ORDER_NUMBER',Value:'1'},{Setting:'CURRENCY',Value:'JOD'},{Setting:'TIMEZONE',Value:'Asia/Amman'},{Setting:'CONFIRMATION_TEMPLATE',Value:'تم تأكيد طلبكم من Delish Cake\\nرقم الطلب: {{Order Number}}\\nالمنتج: {{Product}}\\nتاريخ التسليم: {{Delivery Date}}\\nوقت التسليم: {{Delivery Time}}\\nالإجمالي: {{Total}} {{Currency}}'}]}}
    function saveDb(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}function setting(k){return(db.Settings.find(x=>x.Setting===k)||{}).Value||''}function setSetting(k,v){const r=db.Settings.find(x=>x.Setting===k);r?r.Value=v:db.Settings.push({Setting:k,Value:v});saveDb()}function setupSystem(){['Orders','Employees','AuditLog','Settings'].forEach(n=>{if(!db[n])db[n]=[]});saveDb()}
    function renderLogin(){root.innerHTML=`<section class="login"><div class="loginBox"><h1>Delish Cake</h1><p class="muted">Device Preview يعمل على هذا الجهاز باستخدام localStorage.</p><div class="notice">حسابات تجربة: admin/admin123 · social/social123 · sales/sales123</div><div class="field"><label>Username</label><input id="username" value="admin"></div><div class="field"><label>Password</label><input id="password" type="password" value="admin123" onkeydown="if(event.key==='Enter')login()"></div><div class="actions"><button class="primary" onclick="login()">دخول</button><button onclick="resetPreview()">Reset Data</button></div><p id="loginMsg" class="muted"></p></div></section>`}
    function login(){const u=value('username').toLowerCase(),p=value('password');const e=db.Employees.find(x=>String(x.Username).toLowerCase()===u&&x.Active);if(!e||e['Password Hash']!==hash(p)){document.getElementById('loginMsg').textContent='بيانات الدخول غير صحيحة أو الحساب غير فعال.';return}e['Last Login']=new Date().toISOString();user={employeeId:e['Employee ID'],employeeName:e['Employee Name'],username:e.Username,role:e.Role};localStorage.setItem(SESSION_KEY,JSON.stringify(user));saveDb();renderApp()}
    function renderApp(){const admin=user.role==='Admin'?`<button data-page="employees" onclick="showPage('employees')">الموظفون</button><button data-page="reports" onclick="showPage('reports')">التقارير</button><button data-page="audit" onclick="showPage('audit')">AuditLog</button><button data-page="settings" onclick="showPage('settings')">Settings</button>`:'';root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><strong>Delish Cake</strong><span>${esc(user.employeeName)} · ${esc(user.role)}</span></div><nav class="nav"><button data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button><button data-page="orders" onclick="showPage('orders')">Orders</button><button data-page="calendar" onclick="showPage('calendar')">Calendar</button>${admin}<button onclick="logout()">خروج</button></nav></aside><main class="main"><div id="page"></div></main></div><div id="modal" class="modal"></div>`;showPage(page)}
    function showPage(n){page=n;document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(n==='dashboard')renderDashboard();if(n==='orders')renderOrders();if(n==='calendar')renderCalendar();if(n==='employees')renderEmployees();if(n==='reports')renderReports();if(n==='audit')renderAudit();if(n==='settings')renderSettings()}
    function renderDashboard(){const rows=getVisibleOrders(),today=new Date().toISOString().slice(0,10),todayRows=rows.filter(o=>dateOnly(o['Order Date'])===today||dateOnly(o['Delivery Date'])===today),create=user.role==='Sales Employee'?'':'<button class="primary" onclick="openOrder()">+ طلب جديد</button>';const counts={};STATUSES.forEach(s=>counts[s]=rows.filter(o=>o['Order Status']===s).length);setPage(`<div class="topbar"><h1>Dashboard</h1>${create}</div><div class="notice">هذه نسخة Device Preview. النسخة الأساسية في فولدر project تعمل على Apps Script + Google Sheets.</div><div class="cards"><div class="card"><div class="cardLabel">طلبات اليوم</div><div class="cardValue">${todayRows.length}</div></div><div class="card"><div class="cardLabel">قيمة اليوم</div><div class="cardValue">${money(sum(todayRows,'Total'))}</div></div>${STATUSES.map(s=>`<div class="card"><div class="cardLabel">${esc(s)}</div><div class="cardValue">${counts[s]}</div></div>`).join('')}</div>`)}
    function renderOrders(){const create=user.role==='Sales Employee'?'':'<button class="primary" onclick="openOrder()">+ طلب جديد</button>';setPage(`<div class="topbar"><h1>Orders Board</h1>${create}</div><section class="panel"><div class="toolbar"><input id="q" placeholder="بحث: رقم الطلب، العميل، الهاتف، المستلم"><select id="status"><option value="">كل الحالات</option>${opts(STATUSES)}</select><input id="fromDate" type="date"><input id="toDate" type="date"><button onclick="loadOrders()">بحث</button></div><div id="ordersTable" class="tableWrap"></div></section>`);loadOrders()}
    function loadOrders(){const q=value('q').toLowerCase(),st=value('status'),f=value('fromDate'),t=value('toDate');let rows=getVisibleOrders().filter(o=>(!st||o['Order Status']===st)&&(!f||dateOnly(o['Delivery Date'])>=f)&&(!t||dateOnly(o['Delivery Date'])<=t)&&(!q||[o['Order Number'],o['Customer Name'],o['Customer Phone'],o['Recipient Name'],o['Recipient Phone']].join(' ').toLowerCase().includes(q)));rows.sort((a,b)=>String(a['Delivery Date']+a['Delivery Time']).localeCompare(String(b['Delivery Date']+b['Delivery Time'])));document.getElementById('ordersTable').innerHTML=`<table><thead><tr><th>Order Number</th><th>Customer</th><th>Product</th><th>Delivery Date</th><th>Delivery Time</th><th>Assigned Employee</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>${rows.map(orderRow).join('')}</tbody></table>`}
    function orderRow(o){return`<tr><td><strong>${esc(o['Order Number'])}</strong></td><td>${esc(o['Customer Name'])}<br><span class="muted">${esc(o['Customer Phone'])}</span></td><td>${esc(o.Product)}</td><td>${esc(dateOnly(o['Delivery Date']))}</td><td>${esc(o['Delivery Time'])}</td><td>${esc(o['Assigned Employee'])}</td><td><span class="badge ${o['Order Status']==='ملغي'?'bad':o['Order Status']==='جاهز'?'good':'warn'}">${esc(o['Order Status'])}</span></td><td>${money(o.Total)}</td><td><button onclick="openOrder('${attr(o['Order Number'])}')">فتح</button></td></tr>`}
    function openOrder(no){const existing=no?db.Orders.find(o=>o['Order Number']===no):null;if(no&&!existing)return toast('الطلب غير موجود.');if(existing&&!canView(existing))return toast('ليست لديك صلاحية مشاهدة هذا الطلب.');currentOrder=existing?clone(existing):defaultOrder();const isNew=!currentOrder['Order Number'];openModal(`<div class="modalBox"><div class="panelHeader"><h2>${isNew?'طلب جديد':'طلب '+esc(currentOrder['Order Number'])}</h2><button onclick="closeModal()">إغلاق</button></div><div class="panelBody"><div class="formGrid">${input('Customer Name','اسم العميل')}${input('Customer Phone','هاتف العميل')}${input('Recipient Name','اسم المستلم')}${input('Recipient Phone','هاتف المستلم')}${select('Order Type','نوع الطلب',ORDER_TYPES)}${input('Product','المنتج')}${input('Quantity','الكمية','number')}${input('Size / Persons','الحجم / الأشخاص')}${textarea('Filling','الحشوة')}${textarea('Cake Writing','كتابة الكيك')}${textarea('Add-ons','الإضافات')}${select('Delivery / Pickup','توصيل / استلام',DELIVERY_TYPES)}${textarea('Delivery Address','عنوان التوصيل')}${input('Delivery Fee','رسوم التوصيل','number')}${input('Order Date','تاريخ الطلب','date')}${input('Delivery Date','تاريخ التسليم','date')}${input('Delivery Time','وقت التسليم','time')}${input('Product Price','سعر المنتج','number')}${select('Payment Method','طريقة الدفع',PAYMENT_METHODS)}${input('Paid Amount','المبلغ المدفوع','number')}${select('Payment Status','حالة الدفع',PAYMENT_STATUSES)}${select('Order Status','حالة الطلب',STATUSES)}${input('Assigned Employee','الموظف المسؤول')}${textarea('Design Image','صورة التصميم')}${textarea('Notes','ملاحظات','full')}</div>${isNew?'':`<div class="actions"><button onclick="whatsapp('Customer Phone')">WhatsApp Customer</button><button onclick="whatsapp('Recipient Phone')">WhatsApp Recipient</button><button onclick="copyConfirmation()">Copy Confirmation</button><input id="designFile" type="file" accept="image/*" class="hidden"><button onclick="document.getElementById('designFile').click()">Upload Design</button></div>`}<div class="actions"><button class="primary" onclick="saveOrder()">Save</button>${isNew?'':'<button class="danger" onclick="quickCancel()">Cancel Order</button>'}</div></div></div>`);const file=document.getElementById('designFile');if(file)file.addEventListener('change',uploadDesign)}
    function saveOrder(){const p=collectPayload(),isNew=!currentOrder['Order Number'];if(isNew&&user.role==='Sales Employee')return toast('موظف المبيعات لا يستطيع إنشاء طلب.');if(!isNew&&user.role==='Sales Employee'){const o=db.Orders.find(x=>x['Order Number']===currentOrder['Order Number']);['Payment Method','Paid Amount','Payment Status','Order Status'].forEach(k=>updateField(o,k,k==='Paid Amount'?number(p[k]):p[k],k==='Order Status'?'Status Change':'Payment Change'));recalc(o);stamp(o);saveDb();closeModal();refreshAfterSave();return toast('تم حفظ مراجعة المبيعات.')}try{validateOrder(p)}catch(e){return toast(e.message)}recalc(p);if(isNew){p['Order ID']=id('ORD_');p['Order Number']=nextOrderNumber();p['Created By']=user.employeeId;p['Created Date']=new Date().toISOString();stamp(p);db.Orders.push(p);audit(p['Order Number'],'Create','','','')}else{const o=db.Orders.find(x=>x['Order Number']===currentOrder['Order Number']);Object.keys(p).forEach(k=>updateField(o,k,p[k],actionFor(k,o[k],p[k])));stamp(o)}saveDb();closeModal();refreshAfterSave();toast('تم حفظ الطلب.')}
    function renderCalendar(){const today=new Date().toISOString().slice(0,10);setPage(`<div class="topbar"><h1>Calendar</h1><div><input id="calFrom" type="date" value="${today}"><input id="calTo" type="date" value="${today}"><button onclick="loadCalendar()">عرض</button></div></div><div id="calendar" class="calendarGrid"></div>`);loadCalendar()}function loadCalendar(){const f=value('calFrom'),t=value('calTo'),today=new Date().toISOString().slice(0,10);const rows=getVisibleOrders().filter(o=>(!f||dateOnly(o['Delivery Date'])>=f)&&(!t||dateOnly(o['Delivery Date'])<=t));document.getElementById('calendar').innerHTML=rows.map(o=>{const late=dateOnly(o['Delivery Date'])<today&&!['تم التسليم','ملغي'].includes(o['Order Status']);return`<button class="calendarItem ${late?'late':''}" onclick="openOrder('${attr(o['Order Number'])}')"><strong>${esc(o['Order Number'])}</strong><br>${esc(dateOnly(o['Delivery Date']))} · ${esc(o['Delivery Time'])}<br>${esc(o['Customer Name'])}<br><span class="badge">${esc(o['Order Status'])}</span></button>`}).join('')||'<p class="muted">لا توجد طلبات في هذه الفترة.</p>'}
    function renderEmployees(){if(!adminOnly())return;setPage(`<div class="topbar"><h1>الموظفون</h1><button class="primary" onclick="openEmployee()">+ موظف جديد</button></div><div class="panel tableWrap"><table><thead><tr><th>Employee ID</th><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>${db.Employees.map(e=>`<tr><td>${esc(e['Employee ID'])}</td><td>${esc(e['Employee Name'])}</td><td>${esc(e.Username)}</td><td>${esc(e.Role)}</td><td>${e.Active?'نعم':'لا'}</td><td><button onclick="openEmployee('${attr(e['Employee ID'])}')">تعديل</button></td></tr>`).join('')}</tbody></table></div>`)}
    function openEmployee(idv){const e=idv?clone(db.Employees.find(x=>x['Employee ID']===idv)):{'Employee ID':'','Employee Name':'',Phone:'',Username:'',Role:'Social Media Employee',Active:true};openModal(`<div class="modalBox"><div class="panelHeader"><h2>${idv?'تعديل موظف':'موظف جديد'}</h2><button onclick="closeModal()">إغلاق</button></div><div class="panelBody"><div class="formGrid">${simpleInput('empId','Employee ID',e['Employee ID'])}${simpleInput('empName','Employee Name',e['Employee Name'])}${simpleInput('empPhone','Phone',e.Phone)}${simpleInput('empUsername','Username',e.Username)}${simpleInput('empPassword',idv?'Password (optional)':'Password','password') }<div class="field"><label>Role</label><select id="empRole">${opts(ROLES,e.Role)}</select></div><div class="field"><label>Active</label><select id="empActive"><option value="true" ${e.Active?'selected':''}>نعم</option><option value="false" ${!e.Active?'selected':''}>لا</option></select></div></div><div class="actions"><button class="primary" onclick="saveEmployee()">حفظ</button></div></div></div>`)}
    function saveEmployee(){const eid=value('empId')||nextEmployeeId(),old=db.Employees.find(e=>e['Employee ID']===eid),dup=db.Employees.find(e=>e.Username.toLowerCase()===value('empUsername').toLowerCase()&&e['Employee ID']!==eid);if(dup)return toast('اسم المستخدم مستخدم مسبقًا.');if(!old&&!value('empPassword'))return toast('كلمة المرور مطلوبة.');const r=old||{};r['Employee ID']=eid;r['Employee Name']=value('empName');r.Phone=value('empPhone');r.Username=value('empUsername').toLowerCase();r['Password Hash']=value('empPassword')?hash(value('empPassword')):r['Password Hash'];r.Role=value('empRole');r.Active=value('empActive')==='true';r['Created Date']=r['Created Date']||new Date().toISOString();r['Last Login']=r['Last Login']||'';if(!old)db.Employees.push(r);audit('',old?'Edit':'Create','Employee','',eid);saveDb();closeModal();renderEmployees()}
    function renderReports(){if(!adminOnly())return;const today=new Date().toISOString().slice(0,10);setPage(`<div class="topbar"><h1>Reports</h1><div><input id="repFrom" type="date" value="${today}"><input id="repTo" type="date" value="${today}"><button onclick="loadReports()">عرض</button></div></div><div id="reports"></div>`);loadReports()}function loadReports(){const f=value('repFrom'),t=value('repTo'),rows=db.Orders.filter(o=>(!f||dateOnly(o['Order Date'])>=f)&&(!t||dateOnly(o['Order Date'])<=t));document.getElementById('reports').innerHTML=`<div class="cards"><div class="card"><div class="cardLabel">عدد الطلبات</div><div class="cardValue">${rows.length}</div></div><div class="card"><div class="cardLabel">إجمالي القيمة</div><div class="cardValue">${money(sum(rows,'Total'))}</div></div><div class="card"><div class="cardLabel">الملغاة</div><div class="cardValue">${rows.filter(o=>o['Order Status']==='ملغي').length}</div></div></div>${groupTable('حسب اليوم',group(rows,'Order Date',true))}${groupTable('حسب الموظف',group(rows,'Created By'))}${groupTable('حسب الحالة',group(rows,'Order Status'))}${groupTable('طرق الدفع',group(rows,'Payment Method'))}${groupTable('حسب المنتج',group(rows,'Product'))}`}
    function renderAudit(){if(!adminOnly())return;setPage(`<div class="topbar"><h1>AuditLog</h1></div><div class="panel tableWrap"><table><thead><tr><th>Order</th><th>Employee</th><th>Action</th><th>Field</th><th>Old</th><th>New</th><th>Timestamp</th></tr></thead><tbody>${db.AuditLog.slice().reverse().map(l=>`<tr><td>${esc(l['Order Number'])}</td><td>${esc(l['Employee Name'])}</td><td>${esc(l.Action)}</td><td>${esc(l.Field)}</td><td>${esc(l['Old Value'])}</td><td>${esc(l['New Value'])}</td><td>${esc(l.Timestamp)}</td></tr>`).join('')}</tbody></table></div>`)}
    function renderSettings(){if(!adminOnly())return;setPage(`<div class="topbar"><h1>Settings</h1><button onclick="exportData()">Export JSON</button></div><section class="panel"><div class="panelBody"><pre>Database Check\\n✓ Orders OK\\n✓ Employees OK\\n✓ AuditLog OK\\n✓ Settings OK</pre><div class="formGrid">${db.Settings.map(s=>simpleInput('set_'+s.Setting,s.Setting,s.Value)).join('')}</div><div class="actions"><button class="primary" onclick="saveSettings()">حفظ</button><button class="danger" onclick="resetPreview()">Reset Preview Data</button></div></div></section>`)}function saveSettings(){db.Settings.forEach(s=>s.Value=value('set_'+s.Setting));saveDb();toast('تم حفظ الإعدادات.')}
    function validateOrder(o){if(!STATUSES.includes(o['Order Status']))throw Error('حالة الطلب غير صحيحة.');if(!PAYMENT_STATUSES.includes(o['Payment Status']))throw Error('حالة الدفع غير صحيحة.');if(!PAYMENT_METHODS.includes(o['Payment Method']))throw Error('طريقة الدفع غير صحيحة.');if(number(o['Paid Amount'])>number(o['Product Price'])+number(o['Delivery Fee']))throw Error('المبلغ المدفوع أكبر من الإجمالي.')}function recalc(o){o['Delivery Fee']=number(o['Delivery Fee']);o['Product Price']=number(o['Product Price']);o['Paid Amount']=number(o['Paid Amount']);o.Total=o['Product Price']+o['Delivery Fee'];o['Remaining Amount']=Math.max(0,o.Total-o['Paid Amount'])}function updateField(r,k,v,a){if(String(r[k]??'')===String(v??''))return;const old=r[k];r[k]=v;audit(r['Order Number'],a||'Edit',k,old,v)}function actionFor(k,oldv,newv){if(k==='Order Status')return newv==='ملغي'?'Cancel':oldv==='ملغي'?'Reactivate':'Status Change';if(['Payment Method','Paid Amount','Payment Status'].includes(k))return'Payment Change';if(k==='Assigned Employee')return'Employee Assignment';return'Edit'}function quickCancel(){document.querySelector('[data-key="Order Status"]').value='ملغي';saveOrder()}
    function copyConfirmation(){let m=setting('CONFIRMATION_TEMPLATE');Object.keys(currentOrder).forEach(k=>m=m.replaceAll('{{'+k+'}}',currentOrder[k]||''));m=m.replaceAll('{{Currency}}',setting('CURRENCY')||'JOD');navigator.clipboard.writeText(m).then(()=>toast('تم نسخ رسالة التأكيد.'))}function whatsapp(f){const phone=String(document.querySelector(`[data-key="${f}"]`).value||'').replace(/\\D/g,'');if(!phone)return toast('رقم الهاتف غير موجود.');window.open('https://wa.me/'+phone,'_blank')}function uploadDesign(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{document.querySelector('[data-key="Design Image"]').value=r.result;toast('تم تحميل الصورة محليًا للمعاينة.')};r.readAsDataURL(file)}
    function defaultOrder(){const today=new Date().toISOString().slice(0,10);return{'Order ID':'','Order Number':'','Customer Name':'','Customer Phone':'','Recipient Name':'','Recipient Phone':'','Order Type':'كيكة',Product:'',Quantity:1,'Size / Persons':'',Filling:'','Cake Writing':'','Add-ons':'','Design Image':'','Delivery / Pickup':'توصيل','Delivery Address':'','Delivery Fee':0,'Order Date':today,'Delivery Date':today,'Delivery Time':'12:00','Product Price':0,Total:0,'Payment Method':'Cash','Paid Amount':0,'Remaining Amount':0,'Payment Status':'غير مدفوع','Order Status':'جديد','Assigned Employee':'','Created By':'','Created Date':'','Last Modified By':'','Last Modified Date':'',Notes:''}}function collectPayload(){const o=clone(currentOrder);document.querySelectorAll('[data-key]').forEach(el=>o[el.dataset.key]=el.value);return o}function getVisibleOrders(){return db.Orders.filter(canView)}function canView(o){return user.role==='Admin'||user.role==='Sales Employee'||o['Created By']===user.employeeId||o['Assigned Employee']===user.employeeId||String(o['Assigned Employee']).toLowerCase()===user.employeeName.toLowerCase()}function nextOrderNumber(){const p=setting('ORDER_PREFIX')||'11_';let n=Number(setting('NEXT_ORDER_NUMBER')||1),c=p+n;while(db.Orders.some(o=>o['Order Number']===c)){n++;c=p+n}setSetting('NEXT_ORDER_NUMBER',String(n+1));return c}function nextEmployeeId(){return'EMP_'+(db.Employees.reduce((m,e)=>Math.max(m,Number(String(e['Employee ID']).replace(/\\D/g,''))||0),0)+1)}
    function audit(no,a,f,oldv,newv){db.AuditLog.push({'Log ID':id('LOG_'),'Order Number':no||'','Employee ID':user?user.employeeId:'','Employee Name':user?user.employeeName:'',Action:a||'',Field:f||'','Old Value':oldv??'','New Value':newv??'',Timestamp:new Date().toISOString()})}function stamp(o){o['Last Modified By']=user.employeeId;o['Last Modified Date']=new Date().toISOString()}function input(k,l,t='text'){return`<div class="field"><label>${esc(l)}</label><input data-key="${attr(k)}" type="${t}" value="${attr(currentOrder[k]??'')}"></div>`}function textarea(k,l,cls=''){return`<div class="field ${cls}"><label>${esc(l)}</label><textarea data-key="${attr(k)}">${esc(currentOrder[k]??'')}</textarea></div>`}function select(k,l,list){return`<div class="field"><label>${esc(l)}</label><select data-key="${attr(k)}">${opts(list,currentOrder[k])}</select></div>`}function simpleInput(idv,l,v,t='text'){return`<div class="field"><label>${esc(l)}</label><input id="${attr(idv)}" type="${t}" value="${attr(v??'')}"></div>`}function opts(list,sel=''){return list.map(x=>`<option ${String(x)===String(sel)?'selected':''}>${esc(x)}</option>`).join('')}function group(rows,k,date){const map={};rows.forEach(r=>{const x=date?dateOnly(r[k]):r[k]||'غير محدد';map[x]=map[x]||{key:x,count:0,total:0};map[x].count++;map[x].total+=number(r.Total)});return Object.values(map).sort((a,b)=>String(a.key).localeCompare(String(b.key)))}function groupTable(t,rows){return`<section class="panel"><div class="panelHeader"><h2>${esc(t)}</h2></div><div class="tableWrap"><table><thead><tr><th>Key</th><th>Count</th><th>Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.key)}</td><td>${r.count}</td><td>${money(r.total)}</td></tr>`).join('')}</tbody></table></div></section>`}
    function refreshAfterSave(){page==='orders'?loadOrders():showPage(page)}function adminOnly(){if(user.role==='Admin')return true;setPage('<div class="notice">هذه الصفحة للمدير فقط.</div>');return false}function resetPreview(){if(!confirm('Reset all local preview data?'))return;localStorage.removeItem(STORE_KEY);localStorage.removeItem(SESSION_KEY);db=loadDb();user=null;init()}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='delish-device-preview-data.json';a.click();URL.revokeObjectURL(a.href)}function logout(){localStorage.removeItem(SESSION_KEY);user=null;renderLogin()}function openModal(h){const m=document.getElementById('modal');m.innerHTML=h;m.classList.add('open')}function closeModal(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML=''}function setPage(h){document.getElementById('page').innerHTML=h}function value(idv){return(document.getElementById(idv)||{}).value||''}function toast(m){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),3000)}function hash(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)}return'preview$'+(h>>>0).toString(16)}function id(p){return p+Math.random().toString(16).slice(2,10)+Date.now().toString(16).slice(-6)}function number(v){const n=Number(v||0);return Number.isFinite(n)?n:0}function sum(rows,k){return rows.reduce((a,b)=>a+number(b[k]),0)}function money(v){return number(v).toFixed(2)+' '+(setting('CURRENCY')||'JOD')}function dateOnly(v){return String(v||'').slice(0,10)}function clone(o){return JSON.parse(JSON.stringify(o))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attr(v){return esc(v).replace(/`/g,'&#096;')}
  </script>
