<style>
  :root {
    --bg: #f7f4f1;
    --panel: #ffffff;
    --ink: #201a18;
    --muted: #766b66;
    --line: #e8ddd7;
    --brand: #8d3f45;
    --brand-dark: #5d2930;
    --ok: #26734d;
    --warn: #9b6500;
    --bad: #b3261e;
    --soft: #fbefe9;
    --shadow: 0 8px 24px rgba(47, 30, 24, .07);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Tahoma, sans-serif;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    min-height: 42px;
    border: 0;
    border-radius: 8px;
    padding: 9px 13px;
    background: #ece4df;
    color: var(--ink);
    cursor: pointer;
    font-weight: 700;
  }

  button.primary { background: var(--brand); color: #fff; }
  button.danger { background: var(--bad); color: #fff; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .65; cursor: wait; }

  input, select, textarea {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    background: #fff;
    color: var(--ink);
  }

  textarea { min-height: 86px; resize: vertical; }
  h1, h2, h3, p { margin-top: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  .loginScreen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 18px;
  }

  .loginBox {
    width: min(430px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 22px;
  }

  .loginBox h1 { margin-bottom: 6px; font-size: 28px; }
  .loginBox .field { margin-top: 12px; }

  .appShell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr);
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 16px;
    background: #241b19;
    color: #fff;
    overflow: auto;
  }

  .brand {
    padding: 7px 6px 16px;
    border-bottom: 1px solid rgba(255,255,255,.12);
    margin-bottom: 12px;
  }

  .brand strong { display: block; font-size: 20px; }
  .brand span { display: block; margin-top: 4px; color: #dacac2; font-size: 13px; }

  .nav button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 9px;
    margin: 4px 0;
    background: transparent;
    color: #eadfda;
    text-align: right;
  }

  .nav button.active,
  .nav button:hover {
    background: rgba(255,255,255,.1);
    color: #fff;
  }

  .content {
    min-width: 0;
    padding: 18px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .topbar h1 { margin: 0; font-size: 26px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }

  .card, .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .card { padding: 15px; }
  .cardLabel { color: var(--muted); font-size: 13px; }
  .cardValue { margin-top: 8px; font-size: 28px; font-weight: 800; }

  .panel { margin-top: 14px; overflow: hidden; }
  .panelHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--line);
  }
  .panelHeader h2 { margin: 0; font-size: 18px; }
  .panelBody { padding: 14px; }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) 170px 150px 150px auto;
    gap: 8px;
    padding: 14px;
  }

  .tableWrap { overflow: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 860px;
  }
  th, td {
    border-bottom: 1px solid var(--line);
    padding: 10px;
    text-align: right;
    white-space: nowrap;
    vertical-align: middle;
  }
  th { background: #fff8f4; color: var(--muted); font-size: 13px; }
  tr:hover td { background: #fffdfb; }

  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    border-radius: 999px;
    padding: 4px 9px;
    background: #eee7e2;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .badge.ok { background: #e7f2ec; color: var(--ok); }
  .badge.warn { background: #fff2d8; color: var(--warn); }
  .badge.bad { background: #fde8e6; color: var(--bad); }

  .formGrid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .field label {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .field.full { grid-column: 1 / -1; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 14px;
    background: rgba(32, 26, 24, .62);
  }
  .modal.open { display: flex; }
  .modalBox {
    width: min(1060px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: var(--panel);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }

  .calendarList {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .calendarItem {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: #fff;
  }
  .calendarItem.late { border-color: #efb4ae; background: #fff5f4; }

  .toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 40;
    max-width: min(380px, calc(100vw - 32px));
    padding: 12px 14px;
    border-radius: 8px;
    background: #241b19;
    color: #fff;
    box-shadow: var(--shadow);
  }

  @media (max-width: 980px) {
    .appShell { grid-template-columns: 1fr; }
    .sidebar {
      position: static;
      height: auto;
      padding: 10px;
    }
    .brand { padding-bottom: 10px; }
    .nav {
      display: flex;
      gap: 6px;
      overflow: auto;
      padding-bottom: 2px;
    }
    .nav button { min-width: max-content; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { grid-template-columns: 1fr 1fr; }
    .formGrid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 620px) {
    .content { padding: 12px; }
    .topbar { align-items: stretch; flex-direction: column; }
    .cards, .toolbar, .formGrid, .calendarList { grid-template-columns: 1fr; }
    .panelHeader { align-items: stretch; flex-direction: column; }
    .actions button, .topbar button { width: 100%; }
  }
</style>
